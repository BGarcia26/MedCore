spring.application.name=msepisodios
server.port=${PORT:8087}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
eureka.client.service-url.defaultZone=https://${EUREKA_URL}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuración Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-binding-errors=always

# Habilitar documentación OpenAPI
springdoc.api-docs.path=/api-docs
# Configurar la ruta de la interfaz visual
springdoc.swagger-ui.path=/swagger-ui.html
# Para que Swagger detecte tus controladores correctamente
springdoc.packages-to-scan=com.MedCore.msepisodios.controller