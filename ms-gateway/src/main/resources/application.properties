spring.application.name=msgateway
server.port=8080

# Conexión al servidor Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.http-client.type=restclient

# Propiedades de refresco rápido y el localizador de WebMVC
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.gateway.mvc.discovery.locator.enabled=true