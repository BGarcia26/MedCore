spring.application.name=msmermas
server.port=8086

# Configuración de base de datos para Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/db_medcore?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Configuración Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.web.error.include-binding-errors=always

# Habilitar documentación OpenAPI
springdoc.api-docs.path=/api-docs
# Configurar la ruta de la interfaz visual
springdoc.swagger-ui.path=/swagger-ui.html
# Para que Swagger detecte tus controladores correctamente
springdoc.packages-to-scan=com.MedCore.msmermas.controller