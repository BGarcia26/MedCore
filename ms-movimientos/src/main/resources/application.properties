spring.application.name=msmovimientos
server.port=${PORT:8085}

spring.datasource.url=jdbc:mysql://localhost:3306/db_medcore?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# Configuración Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-binding-errors=always

# Habilitar documentación OpenAPI
springdoc.api-docs.path=/api-docs
# Configurar la ruta de la interfaz visual
springdoc.swagger-ui.path=/swagger-ui.html
# Para que Swagger detecte tus controladores correctamente
springdoc.packages-to-scan=com.MedCore.msmovimientos.controller