services:
  - type: web
    name: eureka
    runtime: docker
    dockerfilePath: ./eureka/Dockerfile
    dockerContext: ./eureka
    plan: free
    envVars:
      - key: PORT
        value: 8761

  - type: web
    name: ms-insumos
    runtime: docker
    dockerfilePath: ./ms-insumos/Dockerfile
    dockerContext: ./ms-insumos
    plan: free
    envVars:
      - key: PORT
        value: 8081
      - key: EUREKA_URL
        fromService:
          type: web
          name: eureka
          property: hostport
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

