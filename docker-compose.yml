      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/db_medcore?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
